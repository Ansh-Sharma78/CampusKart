spring.application.name=campuskart-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.auth.jwt-secret=${JWT_SECRET:dev-only-change-this-secret-before-production-1234567890}
app.auth.access-token-ttl=${ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:7d}
app.auth.verification-token-ttl=${VERIFICATION_TOKEN_TTL:24h}
app.auth.allowed-email-domains=${AUTH_ALLOWED_EMAIL_DOMAINS:edu,ac.in}
app.auth.expose-dev-verification-token=${EXPOSE_DEV_VERIFICATION_TOKEN:true}