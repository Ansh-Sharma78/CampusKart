services:
  mysql:
    image: mysql:8.4
    container_name: campuskart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campuskart
      MYSQL_USER: campuskart
      MYSQL_PASSWORD: campuskart
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:


    
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: campuskart-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campuskart
      DB_USERNAME: campuskart
      DB_PASSWORD: campuskart
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: dev-only-change-this-secret-before-production-1234567890
      AUTH_ALLOWED_EMAIL_DOMAINS: edu,ac.in
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: campuskart-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"

volumes:
  mysql-data: